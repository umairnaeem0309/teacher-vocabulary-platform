[project]
name = "vocab-platform-backend"
version = "0.1.0"
description = "English-Polish Vocabulary Teaching & FSRS Platform - backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.20.0",
    "sentence-transformers>=6.1.0",
    "pgvector>=0.5.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fsrs>=6.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []
# App modules import the repo-root `pipeline` package (search engine,
# storage writers); tests import it via pythonpath already.
mypy_path = [".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
addopts = "-q"
